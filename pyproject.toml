[project]
name = "geap-telco-workshop"
version = "0.1.0"
description = "Notebook environment for the Gemini Enterprise Agent Platform telco conversational analytics workshop (Pulse Telco)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "db-dtypes>=1.3",
    "pyyaml>=6.0",
    "requests>=2.32",
    "google-genai>=1.30",
    "google-adk[gcp,a2a,mcp,agent-identity]==2.11.0",
    "mcp>=1.24,<2",
    "google-cloud-aiplatform[agent_engines,adk,evaluation]>=1.156.0,<2.0.0",
    "google-cloud-bigquery>=3.30",
    "google-cloud-modelarmor>=0.2",
    "google-cloud-logging>=3.12",
    "google-cloud-monitoring>=2.27",
    "google-cloud-trace>=1.16",
]

[tool.uv]
package = false

# Resolve from public PyPI (participants are outside Google's network)
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = ["papermill>=2.6", "nbclient>=0.10", "nbconvert>=7.16"]
